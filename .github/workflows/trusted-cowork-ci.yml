name: Trusted Cowork CI
on:
  push:
    branches: [main, confidential-desktop, cowork-v2-port, cowork-v2-release]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trusted-cowork-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - working-directory: packages/desktop
        run: bun test src/main electron-builder.config.test.ts --timeout 30000
      - working-directory: packages/core
        run: bun run script/test.ts test/config/confidential.test.ts
      - working-directory: packages/cli
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: 0.4.0-alpha.1
        run: bun run script/build.ts --single --skip-install --skip-web-ui
      - working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_DIST: ../cli/dist
        run: |
          bun run build
          bun scripts/confidential-runtime-smoke.ts
          xvfb-run -a bun scripts/confidential-desktop-smoke.ts
