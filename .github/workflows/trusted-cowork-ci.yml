name: Trusted Cowork CI
on:
  push:
    branches: [main, confidential-desktop, release-docs]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trusted-cowork-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - working-directory: packages/desktop
        run: |
          bun typecheck
          find src/main -name '*.test.ts' ! -name 'draft-store.test.ts' -print0 | xargs -0 bun test
          bun test electron-builder.config.test.ts
          node scripts/draft-store-smoke.mjs
      - working-directory: packages/opencode
        run: bun typecheck
