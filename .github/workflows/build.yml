name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --import tsx --test $(find src resources -name '*.test.ts')
      - run: node scripts/hydrate-runtime.mjs
      - run: npm run build
      - run: node scripts/cowork-desktop-smoke.mjs
      # No tag-triggered unsigned installers or automatic releases.
